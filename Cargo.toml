[package]
name = "worker_inegi_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
reqwest = { version = "0.11", features = ["json"] }
regex = "1"
ethers = { version = "2.0", features = ["rustls", "ws"] }
